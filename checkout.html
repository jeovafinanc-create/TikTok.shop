<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | TIKTOK-SHOP</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script><script src="checkout.js" defer></script></head><body>
<header class="site-header"><a class="brand" href="index.html">TIKTOK-SHOP</a><a href="sacola.html">Voltar à sacola</a></header>
<main class="container"><h1 class="page-title">Finalizar pedido</h1><div class="panel"><p class="notice">Ambiente demonstrativo. Não informe dados de cartão neste protótipo. O pagamento real exige integração de servidor segura.</p><form id="checkout-form"><div class="form-grid"><div class="form-group"><label for="name">Nome completo</label><input class="field" id="name" required autocomplete="name"></div><div class="form-group"><label for="email">E-mail</label><input class="field" id="email" type="email" required autocomplete="email"></div><div class="form-group"><label for="phone">Telefone</label><input class="field" id="phone" required autocomplete="tel"></div><div class="form-group"><label for="cep">CEP</label><input class="field" id="cep" required autocomplete="postal-code"></div><div class="form-group"><label for="address">Endereço</label><input class="field" id="address" required autocomplete="street-address"></div><div class="form-group"><label for="number">Número/complemento</label><input class="field" id="number" required></div></div><button class="button button-block" type="submit">Continuar</button></form><p id="checkout-message" aria-live="polite"></p></div></main></body></html>
